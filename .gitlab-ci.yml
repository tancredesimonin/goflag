# Layer 1 — vulnerability scanning (infrastructure/gitlab-templates)
include:
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-trivy-deps.yml"
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-pnpm-audit.yml"
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-scheduled.yml"

default:
  image: node:22.23.1
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules

stages:
  - install
  - verify
  - test
  - security

variables:
  PNPM_VERSION: "9.15.0"
  CI: "true"

# Jobs that only make sense when the CLI package (or the workspace wiring it
# depends on) actually changed. Docs-only commits are frequent and the test
# suite boots HTTP servers and Chromium — several minutes for a README edit,
# against a 400-minute monthly budget.
#
# Deliberately NOT applied to lint / typecheck / format: those are seconds, and
# a merge request whose every job is filtered out produces an empty pipeline,
# which GitLab treats as a failure.
.cli_changes: &cli_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/cli/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

.pnpm: &pnpm
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

install:
  stage: install
  <<: *pnpm
  script:
    - pnpm --version
    - node --version
  artifacts:
    paths:
      - node_modules
    expire_in: 1 hour

lint:
  stage: verify
  <<: *pnpm
  script:
    - pnpm lint

typecheck:
  stage: verify
  <<: *pnpm
  script:
    - pnpm typecheck

format-check:
  stage: verify
  <<: *pnpm
  script:
    - pnpm format:check

build:
  stage: verify
  <<: *pnpm
  script:
    - pnpm build

test:unit:
  stage: test
  <<: [*pnpm, *cli_changes]
  script:
    - pnpm test:unit

test:integration:
  stage: test
  # Playwright image so Chromium is preinstalled and the headless
  # integration tests can run without a separate `playwright install`.
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  <<: [*pnpm, *cli_changes]
  script:
    - pnpm test:integration

# Trivy scans the working dir; disable the cache so only repo sources
# (incl. pnpm-lock.yaml) are scanned, not cached third-party packages.
trivy-deps:
  cache: {}

trivy-scheduled:
  cache: {}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
