# Layer 1 — vulnerability scanning (infrastructure/gitlab-templates)
#
# Skipped on everything the release bot pushes — which is now exactly one thing,
# a tag. A cross-project include is resolved with the permissions of whoever
# triggered the pipeline, and the bot is a project access token: a member of this
# project and no other, so it cannot read `infrastructure`. The include fails and
# the pipeline dies at creation with zero jobs, `publish:npm` included.
#
# Nothing is lost: these jobs already restrict themselves to merge requests and
# the default branch, so they were filtered out on tags anyway.
#
# There used to be a second half here, `$CI_COMMIT_MESSAGE !~ /^chore\(release\)/`,
# because the release job also pushed the version commit to main and to develop.
# It does not any more — that commit now arrives through a merge request opened
# by a person, whose permissions resolve the include fine. Keeping the condition
# would only skip the security scan on the one commit that ships.
include:
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-trivy-deps.yml"
    rules: &not_a_release_push
      - if: $CI_COMMIT_TAG == null
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-pnpm-audit.yml"
    rules: *not_a_release_push
  - project: "tancredesimonin-indie/infrastructure"
    ref: main
    file: "gitlab-templates/security-scheduled.yml"
    rules: *not_a_release_push

default:
  # `auto_cancel_pending_pipelines` is on for this project and was doing almost
  # nothing: GitLab only cancels a *running* job if the job says it may be
  # cancelled, and no job here said so. A second push while the first pipeline
  # was still going left it running to the end — 66 minutes a fortnight,
  # measured over 1-13 August against the jobs this file still declares.
  #
  # In `default:` so it reaches the security jobs from the cross-project
  # includes too; they only read the tree.
  #
  # Everything that writes opts back out below: the deploy template, both
  # publish jobs, and `tag`.
  interruptible: true
  image: node:24.19.0@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584

# No `install` stage. There used to be a job by that name whose whole purpose was
# to publish `node_modules` as an artifact so the jobs after it would not have to
# install — the standard shape, and it never worked here, because the `.pnpm`
# anchor below is applied to every one of those jobs and ends in
# `pnpm install --frozen-lockfile`. Each one downloaded the artifact, unpacked
# it, and then installed straight over it.
#
# The measurement was the giveaway: the job ran `pnpm --version` and `node
# --version` and took 1.77 minutes, which is the same 1.77 minutes `lint` took
# to lint. It was publishing setup, not skipping it.
#
# What actually carries the dependencies between pipelines is the cache keyed on
# `pnpm-lock.yaml`, which is unchanged and still applies to every job through the
# same anchor. Nothing else in this file declares `artifacts:` any more, so no
# job downloads anything at startup — `tag`, which needs git and nothing else,
# was pulling a monorepo's `node_modules` down for no reason at all.
stages:
  - verify
  - test
  - security
  - deploy
  - release

variables:
  CI: "true"
  # `pnpm install` runs the root `prepare` script, which installs the git hooks.
  # A runner has no commits to make, so that is pure setup for nothing — and
  # the hooks are the belt to CI's braces, not a second copy of the same check.
  # Same setting the sites in this group use.
  HUSKY: "0"

# Jobs that only make sense when the CLI package (or the workspace wiring it
# depends on) actually changed. Docs-only commits are frequent and the test
# suite boots HTTP servers and Chromium — several minutes for a README edit,
# against a 400-minute monthly budget.
#
# Deliberately NOT applied to lint / typecheck / format: those are seconds, and
# a merge request whose every job is filtered out produces an empty pipeline,
# which GitLab treats as a failure.
.cli_changes: &cli_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/cli/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitlab-ci.yml

# `test:unit` runs both packages, so it must fire when either one moves. Kept
# separate from `.cli_changes` above: that one gates the jobs that boot HTTP
# servers and Chromium, which only the CLI has.
.pkg_changes: &pkg_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitlab-ci.yml

# The merge request is where a verdict is worth deriving. The push that follows
# a merge used to re-derive it: nine jobs, 88 runs each over 1–13 August, 1431
# minutes spent re-checking content that had already been checked, on a branch
# nobody can push to directly.
#
# Nothing downstream was waiting for it. `deploy-develop` carries
# `dependencies: []` and builds its own image, so not one of those jobs stood
# between a merge and a deploy — they ran beside it.
#
# `build` is the exception and keeps its place on the branch; its own rules say
# why. The two rules removed from the anchors above were the other half of this:
# they fired on `main` and `develop` with no `changes:` filter at all, so the
# packaging and integration suites ran in full on every merge regardless of what
# had moved.
.mr_only: &mr_only
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The cache lives here rather than in `default:` on purpose. Every job in this
# file pulls in this anchor, so they all still get it; the jobs that come from
# the security include do not, which is what the two `cache: {}` overrides used
# to say. Those overrides were the bug: on a ref where the include is skipped,
# they survived as jobs with no `script:`, the config became invalid, and the
# pipeline died at creation — the same zero-job symptom the include itself
# caused, one layer down. A job override cannot outlive the job it overrides.
.pnpm: &pnpm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules
  before_script:
    # No version here on purpose. `packageManager` in package.json is the single
    # declaration; corepack reads it on the first `pnpm` call and fetches that
    # version. A `corepack prepare pnpm@<x> --activate` line alongside it is not
    # a second safety net — it is a second number to keep in sync, and when the
    # two drifted every job downloaded pnpm twice, the activate step being the
    # wasted one. Same reason the Dockerfile says `corepack enable pnpm` bare.
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# One job, three commands, because the commands were never the cost.
#
# `lint`, `typecheck` and `format-check` each paid a full `pnpm install` to run
# something that finishes in about as long as it takes to say. Measured over
# 1–13 August, against the `install` job — which runs `pnpm --version` and
# nothing else, so its duration *is* the setup:
#
#   install        1.77 min      setup and nothing else
#   lint           1.77 min      of which 0.00 is lint
#   format-check   1.75 min      of which 0.00 is the format check
#   typecheck      1.81 min      of which 0.04 is typechecking
#
# Three setups to do four seconds of work. Named `check` rather than `verify`
# because that is what the same merged job is called in the six site
# repositories in this group.
#
# The cost is that a failure stops the job: a formatting slip now hides a type
# error until it is fixed, where three jobs reported all three verdicts at once.
# `pnpm lint` and `pnpm format:check` are both fixed by the pre-commit hook
# before CI ever sees them, so the case is rarer than the ordering suggests.
check:
  stage: verify
  <<: [*pnpm, *mr_only]
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm format:check
    # The one build output this repository commits. Verified rather than
    # regenerated: a pre-commit hook that rewrites it cannot fail a build, and
    # rewriting it on every commit is what made three other sites commit
    # encoder noise for months.
    - pnpm --filter @goflag/website favicon:check

build:
  stage: verify
  <<: *pnpm
  # The one job that stays on `develop` and `main`.
  #
  # A merge request pipeline builds the branch head, not the merge result —
  # `merge_pipelines_enabled` is off on this project — so the merged tree is
  # never compiled until it is already on the branch. Two branches that each
  # typecheck can still produce an import that resolves in neither, and this is
  # the only job positioned to see it.
  #
  # `$CI_PIPELINE_SOURCE == "push"` for the same reason `deploy` carries it: a
  # scheduled pipeline sets `$CI_COMMIT_BRANCH`, and a bare branch rule would
  # rebuild on every schedule, on a commit nobody touched.
  # Not on the push to `main`. That push is the landing of a merge from
  # `develop`, and `develop` compiled the same tree when it landed there —
  # `main` is protected with push allowed to nobody, so nothing else reaches it.
  # The merge request into `main` also runs this job on the branch head, which
  # is that same tree a third time.
  #
  # This holds only while `main` receives merges from `develop` and nothing
  # else. A hotfix branch merged straight into `main` would arrive without ever
  # having been compiled here; `deploy` would still build its own image and
  # fail on a broken tree, but later and less clearly. Confirmed with the
  # maintainer that hotfixes onto `main` do not happen.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  variables:
    # `apps/website` refuses to build without this whenever `CI` or
    # `APP_ENV=production` is set, which is the guard working as intended: the URL
    # is baked into canonicals, hreflang and OG tags, so a build that silently
    # fell back to localhost would ship a site that de-indexes itself. Locally the
    # fallback applies and `pnpm build` passes, so this job was the first place
    # the requirement could bite.
    NEXT_PUBLIC_WEBSITE_FRONTEND_URL: "https://goflag.tech"
  script:
    - pnpm build

test:unit:
  stage: test
  <<: [*pnpm, *pkg_changes]
  script:
    - pnpm test:unit

# The rule catalog's provenance contract has a network half: every cited
# source URL must still resolve (vendor docs drift). Structural validation
# (unique ids, rigor present, dates parse) already runs inside `test:unit` on
# every pipeline; this job only probes third-party servers, so it runs where
# that is worth the flakiness — on schedules (drift detection) and on merge
# requests that actually touch the catalog.
sources:liveness:
  stage: test
  <<: *pnpm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/cli/src/lib/rules/sources/**/*
        - packages/cli/scripts/validate-sources.ts
  script:
    - pnpm --filter @goflag/cli validate:sources

test:integration:
  stage: test
  # Playwright image so Chromium is preinstalled and the headless integration
  # tests can run without a separate `playwright install`.
  #
  # This tag and the `playwright` devDependency are one pin in two files and
  # must move together: the image ships the browser build that one version
  # expects, and `chromium.executablePath()` points somewhere that does not
  # exist as soon as they disagree. The dependency is pinned exactly for the
  # same reason — a caret range silently resolves past the image.
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  <<: [*pnpm, *cli_changes]
  script:
    - pnpm test:integration

# The tarball is what users get; the repository is not. Everything below this
# line exists because a monorepo hides packaging bugs: `dist/` is present
# because we just built it, dependencies resolve because the workspace is
# there. Neither is true in someone else's `node_modules`.
#
# So: pack, install the tarball into an empty directory with npm — not pnpm,
# not the workspace — and run the binary the way `npx goflag` would.
test:package:
  stage: test
  <<: [*pnpm, *cli_changes]
  script:
    - pnpm --filter @goflag/cli build
    # `pnpm pack` prints the absolute tarball path as its last line.
    - TARBALL="$(cd packages/cli && pnpm pack --pack-destination "$CI_PROJECT_DIR" | tail -1)"
    - echo "packed $TARBALL"

    # The npm page and the licence come from files staged by `prepack`. If the
    # hook regresses, the package still installs and the page is silently blank.
    #
    # Listed to a file rather than piped: `grep -q` exits at the first match and
    # closes the pipe, `tar` takes SIGPIPE, and the runner's `pipefail` turns a
    # passing assertion into exit 141.
    - tar -tzf "$TARBALL" > tarball-contents.txt
    - grep -qx 'package/README.md' tarball-contents.txt
    - grep -qx 'package/LICENSE' tarball-contents.txt

    - mkdir -p /tmp/goflag-install && cd /tmp/goflag-install
    - npm init -y > /dev/null
    - npm install "$TARBALL"

    # `playwright` is an *optional peer*: headless mode asks for it at runtime
    # and degrades with a clear message. As an optionalDependency it installed
    # by default, and its postinstall downloads Chromium — a ~150 MB surprise
    # for someone who only wants `--static`. This asserts it stays absent.
    - test ! -d node_modules/playwright

    - ./node_modules/.bin/goflag --version
    - ./node_modules/.bin/goflag --help > /dev/null

# Same reasoning as `test:package`, for the library: the tarball is what a site
# receives, and none of `files`, `exports` or the peer declaration is exercised
# by the workspace. `next` is a real peer rather than an optional one — a
# project installing this without Next has made a mistake worth surfacing — so
# npm pulls it in here, which is also what proves the peer range resolves.
test:package:next:
  stage: test
  <<: [*pnpm, *pkg_changes]
  script:
    - pnpm --filter @goflag/next build
    - TARBALL="$(cd packages/next && pnpm pack --pack-destination "$CI_PROJECT_DIR" | tail -1)"
    - echo "packed $TARBALL"

    # The npm page and the licence. Unlike the CLI these are committed rather
    # than staged by `prepack`: this package has its own README, and the script
    # that stages the repository one would overwrite it.
    - tar -tzf "$TARBALL" > next-tarball-contents.txt
    - grep -qx 'package/README.md' next-tarball-contents.txt
    - grep -qx 'package/LICENSE' next-tarball-contents.txt

    - mkdir -p /tmp/goflag-next-install && cd /tmp/goflag-next-install
    - npm init -y > /dev/null
    - npm install "$TARBALL"

    # Imported, not just resolved. A broken `exports` map installs fine and
    # fails at the first import, which is a site's build rather than ours.
    - |
      node --input-type=module -e "
        import { defineSite } from '@goflag/next';
        const site = defineSite({
          baseUrl: 'https://example.com',
          name: 'example',
          locales: ['en-US'],
          defaultLocale: 'en-US',
          indexable: true,
        });
        const routes = site.routes({ home: { path: '' } });
        const [row] = routes.sitemap();
        if (row.url !== 'https://example.com/en-US') {
          throw new Error('unexpected sitemap row: ' + row.url);
        }
        console.log('imported and rendered from the tarball');
      "

# The same again for the cards, and this is the package that needs it most.
#
# npm rewrites `package.json` at publication, not at packing — the CLI once came
# within a hair of shipping without its command because `bin` was deleted rather
# than normalised, and the local tarball was fine throughout. This package
# declares **two** export subpaths where the other two declare one, so it has
# twice the surface to lose that way, and `@goflag/og/next` disappearing would
# not show up anywhere until a consuming site's build failed.
test:package:og:
  stage: test
  <<: [*pnpm, *pkg_changes]
  script:
    - pnpm --filter @goflag/og build
    - TARBALL="$(cd packages/og && pnpm pack --pack-destination "$CI_PROJECT_DIR" | tail -1)"
    - echo "packed $TARBALL"

    # Committed rather than staged by `prepack`, like the library's.
    - tar -tzf "$TARBALL" > og-tarball-contents.txt
    - grep -qx 'package/README.md' og-tarball-contents.txt
    - grep -qx 'package/LICENSE' og-tarball-contents.txt

    - mkdir -p /tmp/goflag-og-install && cd /tmp/goflag-og-install
    - npm init -y > /dev/null
    # `react` is a peer of the core — the card is a JSX tree, so `index.js`
    # imports `react/jsx-runtime` at module scope. Installing it here is also
    # how we find out whether declaring it as a peer was enough.
    - npm install "$TARBALL" react

    # A file rather than `-e`, so `import.meta.resolve` below has a real parent
    # to resolve against.
    - |
      cat > check.mjs <<'CHECK'
      import { buildIco, fitTitle, oklchToHex } from "@goflag/og";

      const ico = buildIco([{ width: 16, bytes: new Uint8Array(8) }]);
      if (ico.length !== 30) throw new Error(`unexpected ICO length: ${ico.length}`);

      const { fontSize } = fitTitle("Changelog", {
        steps: [{ upTo: 32, fontSize: 72 }],
        smallest: 44,
      });
      if (fontSize !== 72) throw new Error(`unexpected font size: ${fontSize}`);

      // `--terminal` out of the site's stylesheet. A transform that drifts
      // stops being a guard against transcription and becomes one more
      // transcription.
      const hex = oklchToHex([0.19, 0.005, 250]);
      if (hex !== "#121416") throw new Error(`unexpected conversion: ${hex}`);

      // Resolved, not imported: importing it would pull `next/og` and satori
      // into this check, which is Next's contract to keep and not ours. What
      // has to be true here is that the subpath survived into the published
      // `exports` map at all.
      const binding = import.meta.resolve("@goflag/og/next");
      if (!binding.endsWith("/dist/next.js")) {
        throw new Error(`@goflag/og/next resolved to ${binding}`);
      }

      console.log("imported and resolved from the tarball");
      CHECK
    - node check.mjs

# ---------------------------------------------------------------------------
# apps/website — goflag.tech
# ---------------------------------------------------------------------------
# Two environments, two builds. Next bakes the origin, the robots policy and
# the analytics script into the output, so develop and production cannot be the
# same image promoted twice — they are separate builds of the same commit, and
# `config/deploy.develop.yml` is what makes them differ.
#
# Kamal deploys onto the shared OVH host from the infrastructure repo, next to
# the other sites. Nothing new is provisioned: the Beszel agent already reports
# every container on that host, and Gatus watches the three hostnames.
.kamal_deploy_template:
  # Never interrupted. Once a job touching the running site starts, GitLab stops
  # auto-cancelling the pipeline at all — cancel during the checks, never once a
  # deploy is underway. A Kamal deploy killed halfway leaves a partial rollout.
  interruptible: false
  image: docker:29.7.1@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
  services:
    - docker:29.7.1-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
  # `install` publishes node_modules as an artifact. It is no use to a job that
  # installs inside the image, and unpacking it here would drop a host-built
  # node_modules straight into the Docker build context.
  dependencies: []
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache ruby ruby-dev build-base openssh-client
    # Pinned: a floating '~> 2.0' can raise the minimum kamal-proxy mid-pipeline.
    - gem install kamal -v '2.11.0'
    - until test -f /certs/client/ca.pem; do sleep 1; done
    - docker context create tls --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker context use tls
    - unset DOCKER_TLS_CERTDIR DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SERVER_HOST_KEY" >> ~/.ssh/known_hosts
    - echo "$KAMAL_REGISTRY_PASSWORD" | docker login registry.gitlab.com -u "$KAMAL_REGISTRY_USERNAME" --password-stdin

# `$CI_PIPELINE_SOURCE == "push"` is load-bearing. This repository runs
# scheduled pipelines (sources:liveness, the security template), and a
# scheduled pipeline on a branch sets `$CI_COMMIT_BRANCH` — so a bare
# `if: $CI_COMMIT_BRANCH == "main"` would rebuild and redeploy the site on
# every schedule, on a commit nobody touched.
deploy:
  extends: .kamal_deploy_template
  stage: deploy
  script:
    - kamal deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    # The `chore(release)` commit is the one that carries a new
    # packages/cli/CHANGELOG.md — and `workflow:` skips its pipeline outright to
    # break the release loop, so production does not pick the changelog up on
    # its own. It lands with the next merge to main, or by playing this job.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  environment:
    name: production
    url: https://goflag.tech

deploy-develop:
  extends: .kamal_deploy_template
  stage: deploy
  script:
    - kamal deploy -d develop
  # `changes:` because 21 of the 58 pushes to `develop` between 1 and 13 August
  # could not have altered the image, and rebuilt and redeployed a byte-identical
  # site anyway. The Dockerfile installs and builds with
  # `--filter "@goflag/website..."`, so `packages/cli` source never reaches the
  # output and a change to it cannot show on the site.
  #
  # `packages/cli/CHANGELOG.md` is the exception and has to be listed by name:
  # `apps/website/src/lib/changelog.ts:184` reads it by relative path out of the
  # standalone tree at build time, which is also why the Dockerfile copies the
  # workspace root rather than the app alone. `packages/next/CHANGELOG.md` is
  # read the same way and is already covered by the glob above it.
  #
  # The manual rule below is untouched: anything this list gets wrong is one
  # click away from being deployed by hand.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes:
        - apps/**/*
        - packages/next/**/*
        - packages/og/**/*
        - packages/cli/CHANGELOG.md
        - Dockerfile
        - config/deploy*.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  environment:
    name: develop
    url: https://develop.goflag.tech

# Rebooting the proxy restarts 80/443 for every app on the shared host, so it is
# never part of a deploy. Play it by hand when a Kamal upgrade requires a newer
# kamal-proxy than the one pinned in config/deploy.yml.
kamal-proxy-reboot:
  extends: .kamal_deploy_template
  stage: deploy
  script:
    # Non-interactive: the default prompt loops forever in CI (no TTY).
    - kamal proxy reboot --confirmed
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# Publishing happens on a tag and nowhere else: a version is a promise, and
# `develop` makes no promises. Tags come from `pnpm release`
# (commit-and-tag-version), which bumps package.json and tags in one step.
#
# Authentication is a short-lived OIDC token, not a stored credential. npm is
# configured as a trusted publisher for this project and CI file, and trades
# the token GitLab mints below for the right to publish this one package. There
# is nothing left in CI worth stealing: no NPM_TOKEN, nothing to rotate, and
# nothing that keeps working if it leaks.
# One job per package, keyed on the tag namespace. `if: $CI_COMMIT_TAG` alone
# would fire all three on any tag, and each would then fail its own version
# check — a red pipeline on a release that actually succeeded.
publish:npm:
  # Publishing to npm is not reversible. A version yanked is still a version
  # that existed.
  interruptible: false
  stage: release
  <<: *pnpm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  id_tokens:
    NPM_ID_TOKEN:
      # npm rejects any other audience. This is the whole handshake.
      aud: "npm:registry.npmjs.org"
  script:
    # commit-and-tag-version writes both, so a mismatch means the tag was made
    # by hand. Publishing it would put a version on npm that matches no commit.
    - PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
    - |
      if [ "$CI_COMMIT_TAG" != "v$PKG_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match package version $PKG_VERSION" >&2
        exit 1
      fi
    # Already there? Then there is nothing to do, and saying so beats a red
    # pipeline on a release that succeeded. This is the case `publishing.md` §1
    # warns about: a first version published by hand leaves the registry ahead
    # of the tags, and the first automatic run collides with it.
    - |
      if [ -n "$(npm view "@goflag/cli@$PKG_VERSION" version 2>/dev/null)" ]; then
        echo "@goflag/cli@$PKG_VERSION is already on npm — nothing to publish."
        exit 0
      fi
    # npm rather than pnpm: the OIDC exchange is implemented by the npm CLI, so
    # publishing goes through it directly from the package directory.
    # No --provenance: npm only attests public repositories, and this one is
    # private — asking for it would fail the job rather than skip the signature.
    - cd packages/cli && npm publish --access public

# The same handshake for the library, on its own tag namespace.
#
# npm binds a trusted publisher to a package, a project and a CI file path, so
# this needs its own entry in the package settings on npmjs.com — same project
# and same file as the CLI, different package. And it cannot be created before
# the package exists: npm has nothing to attach the publisher to, and a granular
# token does not help because those only restrict to packages already
# published. The first `@goflag/next` version therefore goes out by hand.
publish:next:
  # Same: not reversible.
  interruptible: false
  stage: release
  <<: *pnpm
  rules:
    - if: $CI_COMMIT_TAG =~ /^next-v[0-9]/
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  script:
    - PKG_VERSION="$(node -p "require('./packages/next/package.json').version")"
    - |
      if [ "$CI_COMMIT_TAG" != "next-v$PKG_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match package version $PKG_VERSION" >&2
        exit 1
      fi
    # Same guard as `publish:npm`, and this is the package it was written for:
    # `0.1.0` went out by hand on 2026-08-07, so the registry has a version no
    # tag points at.
    - |
      if [ -n "$(npm view "@goflag/next@$PKG_VERSION" version 2>/dev/null)" ]; then
        echo "@goflag/next@$PKG_VERSION is already on npm — nothing to publish."
        exit 0
      fi
    - cd packages/next && npm publish --access public

# And the same again for the cards. Third namespace, third trusted-publisher
# entry on npmjs.com, same project and same file — and the same first-version
# problem the paragraph above describes: npm has nothing to attach a publisher
# to until the package exists, so `og-v0.1.0` goes out by hand and the guard
# below is what stops the first automatic run from colliding with it.
publish:og:
  # Same: not reversible.
  interruptible: false
  stage: release
  <<: *pnpm
  rules:
    - if: $CI_COMMIT_TAG =~ /^og-v[0-9]/
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  script:
    - PKG_VERSION="$(node -p "require('./packages/og/package.json').version")"
    - |
      if [ "$CI_COMMIT_TAG" != "og-v$PKG_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match package version $PKG_VERSION" >&2
        exit 1
      fi
    - |
      if [ -n "$(npm view "@goflag/og@$PKG_VERSION" version 2>/dev/null)" ]; then
        echo "@goflag/og@$PKG_VERSION is already on npm — nothing to publish."
        exit 0
      fi
    - cd packages/og && npm publish --access public

# Merging develop into main is the decision to publish. This job is the only
# thing the pipeline ever writes back to the repository, and it writes exactly
# one kind of ref: a tag, on a commit that is already on main.
#
# It bumps nothing. The version and the changelog are authored on a branch,
# reviewed, and merged like every other commit — `main` and `develop` both
# refuse a push from everyone, CI included, and a release that needs an
# exception to that rule is a release nobody read. `pnpm release` at the
# repository root is what writes them; see AGENTS.md.
#
# So this job reconciles rather than releases: main declares a version, and the
# tag either already exists or gets created. That makes it idempotent, safe to
# retry, and self-healing — a tag lost to a failed pipeline is created by the
# next merge instead of by hand.
#
# No `<<: *pnpm`: this needs `node` from the image and nothing else. A tag that
# cannot be created because a dependency failed to resolve is a coupling with
# no purpose.
#
# Needs RELEASE_TOKEN — a project access token with the Maintainer role and
# `write_repository`, because `v*`, `next-v*` and `og-v*` are protected tags and
# only Maintainers may create them. The job token cannot, and a push made with
# it would not trigger the tag pipeline that publishes.
#
# A new namespace has to be protected in the project's settings before its first
# release, or `tag_one` pushes a ref the remote refuses — and refuses silently
# from the point of view of the two namespaces that worked.
tag:
  # The only job that writes back to this repository. It is idempotent, but a
  # push of a ref interrupted between `git tag` and `git push` is a tag that
  # exists locally and nowhere else.
  interruptible: false
  stage: release
  # `$CI_PIPELINE_SOURCE == "push"`, for the reason `deploy` carries it a
  # hundred lines up: a scheduled pipeline sets `$CI_COMMIT_BRANCH`, and so does
  # one started from the "Run pipeline" button. A bare branch rule would put the
  # one job that writes to this repository into every one of them — reconciling
  # a tag against a commit nobody touched. This repository is about to get a
  # weekly schedule for the security scan, which is what makes that concrete.
  #
  # The manual rule keeps the retry the paragraph above promises: idempotent and
  # safe to retry means there has to be a way to ask for it, and re-running a
  # pipeline is a `web` pipeline, which the first rule no longer matches.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    # The tag lands on the develop side of the merge, so the history has to be
    # there to find it.
    GIT_DEPTH: 0
  script:
    - git config user.name "goflag release"
    - git config user.email "39413504+tancredesimonin@users.noreply.github.com"
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

    # Tag the develop side of the merge, not the merge itself.
    #
    # A merge commit on main is never an ancestor of develop, so a tag placed on
    # it is invisible from every future branch. `commit-and-tag-version` looks
    # its previous tag up with `git describe`, which needs reachability — it
    # found nothing, concluded this was a first release, and replayed the entire
    # history into the changelog. `@goflag/next@0.3.0` was written listing every
    # commit `0.2.0` already carried.
    #
    # The second parent is the develop head the merge brought in. It has the
    # same manifest as the merge commit, since that is what the merge took, and
    # it is on develop by definition — which is exactly what `git describe`
    # needs from the next release.
    #
    # A fast-forward has no second parent, and then the merge commit and the
    # develop head are the same commit anyway.
    - |
      TARGET="$(git rev-parse --verify --quiet "${CI_COMMIT_SHA}^2" || echo "$CI_COMMIT_SHA")"
      echo "tagging $TARGET ($(git log -1 --format=%s "$TARGET"))"

    # One ref per push, and never `--tags` or `--follow-tags`. Both bundle
    # several refs into one payload, and GitLab declines the entire payload when
    # any single ref in it is refused — which is how a branch rejection took two
    # innocent tags down with it on 2026-08-08.
    - |
      tag_one() {
        NAME="$1"; MANIFEST="$2"; PREFIX="$3"
        TAG="$PREFIX$(node -p "require('./$MANIFEST').version")"

        # Asked of the remote rather than the local clone: the checkout is
        # shallow and fetches no tags, so a local lookup answers "absent" every
        # time and the push then fails on an existing tag instead of skipping.
        if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
          echo "$NAME: $TAG is already tagged — nothing to do."
          return 0
        fi

        # Annotated, like the ones commit-and-tag-version used to write: a
        # lightweight tag records neither who created it nor when.
        git tag -a "$TAG" -m "$TAG" "$TARGET"
        git push origin "refs/tags/$TAG"
        echo "$NAME: tagged $TAG"
      }

    - tag_one "@goflag/cli" "packages/cli/package.json" "v"
    - tag_one "@goflag/next" "packages/next/package.json" "next-v"
    - tag_one "@goflag/og" "packages/og/package.json" "og-v"

workflow:
  rules:
    # First, and deliberately so. A tag pipeline shares the commit message of
    # the commit it points at, so any rule matching a message would take the
    # publishing pipeline down with it. This is the same trap as putting
    # `[skip ci]` in a release commit: it skips the tag too.
    - if: $CI_COMMIT_TAG

    # There used to be a `when: never` here for `chore(release)` commits on
    # main, because the release job pushed its own commit back and would
    # otherwise have re-run on it. Nothing pushes a commit to main any more, so
    # there is no loop to cut — and the rule became actively harmful: a release
    # merged fast-forward leaves `chore(release)` as the tip of main, and
    # skipping that pipeline is skipping the only job that creates the tag.

    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
