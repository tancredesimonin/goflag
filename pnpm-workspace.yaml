# Published artefacts live under `packages/`, deployed ones under `apps/`.
# Keeping them apart means a release script that iterates over packages never
# picks up the website, and `rules:changes` in CI can key on the distinction.
#
# `apps/website` is the marketing and documentation site. `packages/next` is the
# library that produces what the CLI audits; both landed after this split was
# written, and the split is what keeps a release script iterating over packages
# from ever picking up the site.
packages:
  - "packages/*"
  - "apps/*"

# Hold newly published versions back for three days. This is the layer that actually holds:
# Renovate exempts security updates from its own minimumReleaseAge, and pnpm does not — it
# refuses to resolve a version inside the window at all, writes no lockfile, and so fails CI
# before any automerge can fire. It covers transitive packages, which Renovate never gated,
# and lockFileMaintenance, which Renovate documents as not supporting minimumReleaseAge.
#
# It matters more for a published package than for a site, though not because consumers
# install what resolves here — they do not. The tarball carries no lockfile and tsup keeps
# `cheerio` external, so an install of @goflag/cli resolves cheerio's tree, `undici`
# included, on the consumer's machine and from cheerio's own ranges. What resolves here is
# the toolchain that builds `dist`, and `dist` is what every consumer installs.
minimumReleaseAge: 4320

# Install-time build scripts, denied. pnpm 9 ran every postinstall it found, so unlike the
# sibling repos this is a real change rather than a restatement of what pnpm already did.
# Both are dev-only and neither needs its script here: esbuild resolves its native binary
# through optional platform sub-packages, and msw's postinstall exists to copy a service
# worker into a browser app's public directory, which a CLI has none of. Denied rather than
# carried over because the full build, the typecheck and every test passed without them —
# the permission was never doing anything. msw has since left the tree altogether: the
# lockfile rebuild of 2026-08-02 dropped it, so its line below denies nothing today.
#
# The four below arrived with `apps/website`, and are denied for the same reason as esbuild:
# each ships its native code as optional per-platform packages that pnpm installs directly,
# so the install script is only a fallback compile path. `@parcel/watcher` is narrower still
# — content-collections reaches for it in watch mode only, which is `pnpm dev`, never CI.
# Verified rather than assumed: `pnpm build` and `pnpm typecheck` pass across the workspace
# with all four denied.
allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  "@swc/core": false
  "@parcel/watcher": false
  unrs-resolver: false

# Security floors. `undici` and `fast-uri` were moved verbatim from the package.json
# `pnpm.overrides` block — pnpm 11 no longer reads that field, so leaving them there would
# have dropped both silently; the other three were written here. Floors, not pins: each is
# a caret range, so the lockfile is what holds the exact version, and `pnpm update` moves
# it to the newest release in range that has cleared the window above.
overrides:
  # 3.3.18 patches GHSA-2v37-7h3g-55p8 (high): a custom generator loops forever
  # when asked for size 0. Its only production path is `next` → `postcss` →
  # `nanoid` in `apps/website`; the packages reach it through devDependencies
  # alone. So no consumer of a published package was ever exposed — none of
  # `@goflag/cli`, `@goflag/next` and `@goflag/og` has it among its runtime
  # dependencies, directly or not.
  # The floor is raised anyway: the audit job reads the whole workspace, and a
  # `high` left standing is one nobody looks at twice.
  nanoid: "^3.3.18"
  undici: ^7.28.0
  fast-uri: ^3.1.2

  # Both arrived with `apps/website`, and both were Next's own pins rather than
  # anything we asked for: 16.2.12 depended on `postcss` at exactly 8.4.31 and
  # resolved `sharp` to 0.34.x, which were the three `high` advisories that
  # `pnpm audit --prod --audit-level=high` failed the pipeline on. The patched
  # versions were already in the tree for our own use, so the lockfile carried the
  # fixed and the vulnerable copy of each side by side. Next has moved both since:
  # 16.3.6 asks for `postcss` 8.5.23 and `sharp` ^0.35.4 on its own.
  #
  # postcss was a minor bump inside the range everything else already accepted.
  # sharp crossed a minor, which mattered little while nothing used it but
  # `next/image`, which this site never imports. The favicon script has imported
  # it since 2026-08-15, and `favicon:check` runs that script in CI.
  postcss: ^8.5.18
  sharp: ^0.35.0
