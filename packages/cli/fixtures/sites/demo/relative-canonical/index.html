<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Goflag Demo — Relative Canonical</title>
    <meta
      name="description"
      content="This page is otherwise well-formed but declares a relative canonical URL, which must be flagged as an error."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Relative canonical: must trip canonical.absolute (error). -->
    <link rel="canonical" href="/relative-canonical" />
    <meta property="og:title" content="Goflag Demo — Relative Canonical" />
    <meta property="og:description" content="Otherwise well-formed, but the canonical is relative." />
    <meta property="og:image" content="https://demo.example/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Preview card: Goflag Demo — Relative Canonical" />
  </head>
  <body>
    <main>
      <h1>Relative canonical</h1>
      <a href="/en">Home</a>
    </main>
  </body>
</html>
